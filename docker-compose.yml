version: "3.9"

services:
  # ── MinIO (S3-compatible file storage) ──────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-uni3d}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-change_me_in_production}
    volumes:
      - miniodata:/data
    ports:
      - "9001:9001"

  # ── Kiri:Moto (slicer engine) ──────────────────────────────
  kirimoto:
    image: gridspace3d/kirimoto:latest
    restart: unless-stopped
    expose:
      - "8080"

  # ── FastAPI Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: minio:9000
      MINIO_USER: ${MINIO_USER:-uni3d}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-change_me_in_production}
      SECRET_KEY: ${SECRET_KEY:-generate_a_real_secret_key}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    expose:
      - "8000"

  # ── React Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"

  # ── Nginx reverse proxy ────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./landing:/usr/share/nginx/landing:ro
    depends_on:
      - backend
      - frontend
      - kirimoto

volumes:
  miniodata:
