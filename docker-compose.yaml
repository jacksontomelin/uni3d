version: "3.9"

services:
  # ── PostgreSQL (interno, mesma rede) ───────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: uni3d
      POSTGRES_USER: uni3d
      POSTGRES_PASSWORD: ${DB_PASSWORD:-uni3d_secure_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uni3d"]
      interval: 5s
      retries: 10

  # ── MinIO (S3-compatible file storage) ──────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-uni3d}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-change_me_in_production}
    volumes:
      - miniodata:/data
    expose:
      - "9000"
      - "9001"

  # ── Kiri:Moto (slicer engine) ──────────────────────────────
  kirimoto:
    build:
      context: ./kirimoto
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"

  # ── FastAPI Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://uni3d:${DB_PASSWORD:-uni3d_secure_2026}@postgres:5432/uni3d
      MINIO_ENDPOINT: minio:9000
      MINIO_USER: ${MINIO_USER:-uni3d}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-change_me_in_production}
      SECRET_KEY: ${SECRET_KEY:-generate_a_real_secret_key}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    expose:
      - "8000"

  # ── Nginx reverse proxy ────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_NGINX_80=/
    ports:
      - "8090:80"
    expose:
      - "80"
    depends_on:
      - backend
      - kirimoto

volumes:
  pgdata:
  miniodata:
