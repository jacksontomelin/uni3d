version: "3.9"

services:
  # ── MinIO (S3-compatible file storage) ──────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-uni3d}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-change_me_in_production}
    volumes:
      - miniodata:/data
    expose:
      - "9000"
      - "9001"

  # ── Kiri:Moto (slicer engine) ──────────────────────────────
  kirimoto:
    build:
      context: ./kirimoto
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"

  # ── FastAPI Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: minio:9000
      MINIO_USER: ${MINIO_USER:-uni3d}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-change_me_in_production}
      SECRET_KEY: ${SECRET_KEY:-generate_a_real_secret_key}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    expose:
      - "8000"

  # ── Nginx reverse proxy ────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_NGINX_80=/
    ports:
      - "8090:80"
    expose:
      - "80"
    depends_on:
      - backend
      - kirimoto

volumes:
  miniodata:
