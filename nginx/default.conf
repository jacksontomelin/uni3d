server {
    listen 80;
    client_max_body_size 200M;

    # DNS interno do Docker/Coolify — resolve os nomes em runtime,
    # não no boot (evita 502 quando um container sobe depois do nginx).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── API (FastAPI) ─────────────────────────────────────
    location /api/ {
        set $up_backend backend;
        proxy_pass http://$up_backend:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Kiri:Moto slicer ──────────────────────────────────
    location /slicer/ {
        set $up_kiri kirimoto;
        rewrite ^/slicer/(.*)$ /kiri/$1 break;
        proxy_pass http://$up_kiri:8080;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
    }

    # ── Landing page (visitante, raiz exata) ──────────────
    location = / {
        root /usr/share/nginx/landing;
        try_files /index.html =404;
    }
    location /img/ {
        root /usr/share/nginx/landing;
    }

    # ── Frontend (app React, catch-all) ───────────────────
    location / {
        set $up_front frontend;
        proxy_pass http://$up_front:3000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
    }
}
