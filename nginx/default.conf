server {
    listen 80;
    client_max_body_size 200M;
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/app;
    index index.html;

    # ── API (FastAPI) ─────────────────────────────────────
    location /api/ {
        set $up_backend backend;
        proxy_pass http://$up_backend:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Kiri:Moto — TUDO em /kiri/ vai pro container (HTML + assets) ──
    # O Kiri usa caminhos absolutos /kiri/... para todos os recursos,
    # então basta mandar todo o prefixo /kiri/ pro container, incluindo CSS/JS/wasm.
    location /kiri/ {
        set $up_kiri kirimoto;
        proxy_pass http://$up_kiri:8080/kiri/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # ── Landing page (raiz exata) ─────────────────────────
    location = / {
        root /usr/share/nginx/landing;
        try_files /index.html =404;
    }
    location /img/ { root /usr/share/nginx/landing; }

    # ── App SPA (React) — fallback pro index.html ─────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
