upstream backend  { server backend:8000;  }
upstream frontend { server frontend:3000; }
upstream kirimoto { server kirimoto:8080; }

server {
    listen 80;
    client_max_body_size 200M;

    # ── API ───────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Kiri:Moto slicer (iframe / direct) ────────────────
    location /slicer/ {
        proxy_pass http://kirimoto/;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
    }

    # ── MinIO presigned download proxy (optional) ─────────
    location /files/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
    }

    # ── Landing page (visitante) ──────────────────────────
    location = / { root /usr/share/nginx/landing; try_files /index.html =404; }
    location /img/ { root /usr/share/nginx/landing; }

    # ── Frontend (app) ────────────────────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
    }
}
